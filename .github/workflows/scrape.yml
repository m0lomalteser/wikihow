name: Build ZIM Artifact

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      language:
        description: 'Language code to scrape (e.g. de, en, fr, es)'
        required: true
        default: 'de'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check Formatting & Lint
        run: |
          black --check --line-length 88 .
          isort --check-only --profile black .
          flake8 . --max-line-length=88

  build-zim:
    name: Build ZIM File & Upload Artifact
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & wikihow2zim
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-build-isolation .

      - name: Patch Dependencies (Retry & Error Handling)
        run: |
          cat << 'EOF' > patch_all.py
          import glob
          import re

          # 1. Patch pywikiapi/Site.py for Retries & Graceful Error Handling
          site_paths = glob.glob('/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/pywikiapi/Site.py')
          for path in site_paths:
              with open(path, 'r', encoding='utf-8') as f:
                  code = f.read()

              # Inject Retry-Loop into request()
              old_req = 'r = self.session.request(method, **request_kw)'
              retry_req = (
                  'for _attempt in range(5):\n'
                  '            r = self.session.request(method, **request_kw)\n'
                  '            if r.status_code < 500:\n'
                  '                break\n'
                  '            import time\n'
                  '            print(f"[RETRY] Server returned {r.status_code}. Waiting {_attempt + 1}s...")\n'
                  '            time.sleep(_attempt + 1)'
              )
              if old_req in code:
                  code = code.replace(old_req, retry_req, 1)

              # Graceful Degradation: If HTTP 500 persists, return empty dict response instead of crashing
              old_err = "raise ApiError('Call failed', {\"status_code\": r.status_code, \"text_body\": r.text}) from None"
              fallback_err = (
                  "if r.status_code >= 500:\n"
                  "            print('[WARNING] Persistent 500 error ignored. Returning empty response to continue scrape.')\n"
                  "            class DummyResponse:\n"
                  "                text = '{}'\n"
                  "                status_code = 200\n"
                  "                def json(self):\n"
                  "                    return {}\n"
                  "            return DummyResponse()\n"
                  "        raise ApiError('Call failed', {\"status_code\": r.status_code, \"text_body\": r.text}) from None"
              )
              if old_err in code:
                  code = code.replace(old_err, fallback_err)

              with open(path, 'w', encoding='utf-8') as f:
                  f.write(code)
              print(f'[OK] Successfully patched pywikiapi at {path}')

          # 2. Patch wikihow2zim/scraper.py (Favicon & Batch Limit)
          scraper_paths = glob.glob('/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/wikihow2zim/scraper.py')
          for path in scraper_paths:
              with open(path, 'r', encoding='utf-8') as f:
                  code = f.read()

              # Throttle category batch limit to 50
              code = re.sub(r'cmlimit=["\']?\w+["\']?', 'cmlimit=50', code)

              # Favicon fix
              target_fav = 'soup.find("link", rel="shortcut icon").attrs.get("href")'
              repl_fav = '(soup.find("link", rel=lambda r: r and "icon" in (r if isinstance(r, str) else " ".join(r))) or soup.find("link")).attrs.get("href", "/favicon.ico")'
              if target_fav in code:
                  code = code.replace(target_fav, repl_fav)

              with open(path, 'w', encoding='utf-8') as f:
                  f.write(code)
              print(f'[OK] Successfully patched wikihow2zim at {path}')
          EOF
          python patch_all.py

      - name: Create Output Directory
        run: mkdir -p output

      - name: Run wikihow2zim Scraper
        run: |
          LANG_CODE="${{ github.event.inputs.language || 'de' }}"
          wikihow2zim \
            --language "$LANG_CODE" \
            --without-videos \
            --skip-dom-check \
            --skip-footer-links \
            --api-delay 2.5 \
            --debug \
            --output output/

      - name: Upload ZIM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikihow-${{ github.event.inputs.language || 'de' }}-zim
          path: output/*.zim
          retention-days: 7
