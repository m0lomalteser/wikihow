name: Build ZIM Artifact

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      language:
        description: 'Language code to scrape (e.g. de, en, fr, es)'
        required: true
        default: 'de'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check Formatting & Lint
        run: |
          black --check --line-length 88 .
          isort --check-only --profile black .
          flake8 . --max-line-length=88

  build-zim:
    name: Build ZIM File & Upload Artifact
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & wikihow2zim
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-build-isolation .

      - name: Patch wikihow2zim & pywikiapi
        run: |
          cat << 'EOF' > patch_dependencies.py
          import glob
          import os

          # 1. Favicon Patch in wikihow2zim
          targets_scraper = glob.glob('/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/wikihow2zim/scraper.py') + glob.glob('wikihow2zim/scraper.py')
          for path in targets_scraper:
              if os.path.exists(path):
                  with open(path, 'r', encoding='utf-8') as f:
                      code = f.read()
                  target = 'soup.find("link", rel="shortcut icon").attrs.get("href")'
                  replacement = '(soup.find("link", rel=lambda r: r and "icon" in (r if isinstance(r, str) else " ".join(r))) or soup.find("link")).attrs.get("href", "/favicon.ico")'
                  if target in code:
                      code = code.replace(target, replacement)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(code)
                      print(f'Successfully patched wikihow2zim at {path}')

          # 2. Retry/Error Patch in pywikiapi/Site.py
          targets_pywiki = glob.glob('/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/pywikiapi/Site.py')
          for path in targets_pywiki:
              if os.path.exists(path):
                  with open(path, 'r', encoding='utf-8') as f:
                      code = f.read()
                  
                  target_err = 'raise ApiError(\'Call failed\', {"status_code": r.status_code, "text_body": r.text}) from None'
                  
                  retry_code = (
                      'if r.status_code >= 500:\n'
                      '            import time\n'
                      '            for _retry in range(5):\n'
                      '                wait_time = 2 ** _retry\n'
                      '                print(f"[RETRY] Server returned {r.status_code}. Retrying in {wait_time}s...")\n'
                      '                time.sleep(wait_time)\n'
                      '                r = self.session.request(method, **request_kw)\n'
                      '                if r.status_code < 500:\n'
                      '                    break\n'
                      '        if r.status_code != 200:\n'
                      '            raise ApiError(\'Call failed\', {"status_code": r.status_code, "text_body": r.text}) from None'
                  )

                  if target_err in code:
                      code = code.replace(target_err, retry_code)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(code)
                      print(f'Successfully patched ApiError retry in pywikiapi at {path}')
                  else:
                      print(f'Warning: Target ApiError string not found in {path}')
          EOF
          python patch_dependencies.py

      - name: Create Output Directory
        run: mkdir -p output

      - name: Run wikihow2zim Scraper
        run: |
          LANG_CODE="${{ github.event.inputs.language || 'de' }}"
          wikihow2zim \
            --language "$LANG_CODE" \
            --without-videos \
            --skip-dom-check \
            --skip-footer-links \
            --api-delay 2.0 \
            --debug \
            --output output/

      - name: Upload ZIM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikihow-${{ github.event.inputs.language || 'de' }}-zim
          path: output/*.zim
          retention-days: 7
