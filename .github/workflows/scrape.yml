name: Build ZIM Artifact

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      language:
        description: 'Language code to scrape (e.g. de, en, fr, es)'
        required: true
        default: 'de'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check Formatting & Lint
        run: |
          black --check --line-length 88 .
          isort --check-only --profile black .
          flake8 . --max-line-length=88

  build-zim:
    name: Build ZIM File & Upload Artifact
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & wikihow2zim
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-build-isolation .

      - name: Patch wikihow2zim & pywikiapi
        run: |
          python -c "
          import glob, re

          # 1. Favicon Patch in wikihow2zim
          files = glob.glob('/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/wikihow2zim/scraper.py') + glob.glob('wikihow2zim/scraper.py')
          for path in files:
              with open(path, 'r') as f:
                  code = f.read()
              target = 'soup.find(\"link\", rel=\"shortcut icon\").attrs.get(\"href\")'
              replacement = '(soup.find(\"link\", rel=lambda r: r and \"icon\" in (r if isinstance(r, str) else \" \".join(r))) or soup.find(\"link\")).attrs.get(\"href\", \"/favicon.ico\")'
              if target in code:
                  code = code.replace(target, replacement)
                  with open(path, 'w') as f:
                      f.write(code)
                  print(f'Successfully patched wikihow2zim at {path}')

          # 2. Retry Patch in pywikiapi for HTTP 500 errors
          pywiki_files = glob.glob('/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/pywikiapi/Site.py')
          for path in pywiki_files:
              with open(path, 'r') as f:
                  code = f.read()
              if 'time.sleep' not in code:
                  code = 'import time\n' + code
              old_req = 'response = self.session.request(method, url, **request_kw)'
              new_req = '''for attempt in range(5):
              response = self.session.request(method, url, **request_kw)
              if response.status_code < 500 and response.status_code != 429:
                  break
              time.sleep(2 * (attempt + 1))'''
              if old_req in code:
                  code = code.replace(old_req, new_req)
                  with open(path, 'w') as f:
                      f.write(code)
                  print(f'Successfully patched pywikiapi retry logic at {path}')
          "

      - name: Create Output Directory
        run: mkdir -p output

      - name: Run wikihow2zim Scraper
        run: |
          LANG_CODE="${{ github.event.inputs.language || 'de' }}"
          wikihow2zim \
            --language "$LANG_CODE" \
            --without-videos \
            --skip-dom-check \
            --skip-footer-links \
            --api-delay 1 \
            --debug \
            --output output/

      - name: Upload ZIM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikihow-${{ github.event.inputs.language || 'de' }}-zim
          path: output/*.zim
          retention-days: 7
