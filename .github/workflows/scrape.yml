name: Build ZIM Artifact

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      language:
        description: 'Language code to scrape (e.g. de, en, fr, es)'
        required: true
        default: 'de'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check Formatting & Lint
        run: |
          black --check --line-length 88 .
          isort --check-only --profile black .
          flake8 . --max-line-length=88

  build-zim:
    name: Build ZIM File & Upload Artifact
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & wikihow2zim
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-build-isolation .

      - name: Setup Runtime Monkey-Patch (sitecustomize) & Favicon Patch
        run: |
          python -c "
          import site, os, glob

          # 1. Favicon Expression Patch in wikihow2zim
          targets_scraper = glob.glob('/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/wikihow2zim/scraper.py') + glob.glob('wikihow2zim/scraper.py')
          for path in targets_scraper:
              if os.path.exists(path):
                  with open(path, 'r', encoding='utf-8') as f:
                      code = f.read()
                  target = 'soup.find(\"link\", rel=\"shortcut icon\").attrs.get(\"href\")'
                  replacement = '(soup.find(\"link\", rel=lambda r: r and \"icon\" in (r if isinstance(r, str) else \" \".join(r))) or soup.find(\"link\")).attrs.get(\"href\", \"/favicon.ico\")'
                  if target in code:
                      code = code.replace(target, replacement)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(code)
                      print(f'[OK] Patched Favicon handling in {path}')

          # 2. Setup sitecustomize.py for safe, runtime Retry Monkey-Patching
          site_packages = site.getsitepackages()[0]
          sitecustomize_path = os.path.join(site_packages, 'sitecustomize.py')
          
          patch_code = '''
          import time
          try:
              import pywikiapi.Site
              _orig_request = pywikiapi.Site.Site.request

              def patched_request(self, method, **request_kw):
                  for attempt in range(6):
                      try:
                          return _orig_request(self, method, **request_kw)
                      except Exception as e:
                          if attempt == 5:
                              raise e
                          wait_time = (attempt + 1) * 3
                          print(f\"[RETRY] API request failed ({e}). Retrying in {wait_time}s... (Attempt {attempt + 1}/6)\")
                          time.sleep(wait_time)

              pywikiapi.Site.Site.request = patched_request
              print(\"[PATCH] Successfully injected pywikiapi retry logic via sitecustomize\")
          except Exception as e:
              print(f\"[PATCH WARNING] Could not apply sitecustomize patch: {e}\")
          '''

          with open(sitecustomize_path, 'w', encoding='utf-8') as f:
              f.write(patch_code)
          print(f'[OK] Created runtime patch at {sitecustomize_path}')
          "

      - name: Create Output Directory
        run: mkdir -p output

      - name: Run wikihow2zim Scraper
        run: |
          LANG_CODE="${{ github.event.inputs.language || 'de' }}"
          wikihow2zim \
            --language "$LANG_CODE" \
            --without-videos \
            --skip-dom-check \
            --skip-footer-links \
            --api-delay 2.0 \
            --debug \
            --output output/

      - name: Upload ZIM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikihow-${{ github.event.inputs.language || 'de' }}-zim
          path: output/*.zim
          retention-days: 7
