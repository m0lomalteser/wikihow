name: Build ZIM Artifact

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      language:
        description: 'Language code to scrape (e.g. de, en, fr, es)'
        required: true
        default: 'de'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check Formatting & Lint
        run: |
          black --check --line-length 88 .
          isort --check-only --profile black .
          flake8 . --max-line-length=88

  build-zim:
    name: Build ZIM File & Upload Artifact
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & wikihow2zim
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-build-isolation .

      - name: Create Output Directory
        run: mkdir -p output

      - name: Run wikihow2zim Scraper
        run: |
          LANG_CODE="${{ github.event.inputs.language || 'de' }}"
          wikihow2zim --language "$LANG_CODE" --skip-dom-check --output output/

      - name: Upload ZIM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikihow-${{ github.event.inputs.language || 'de' }}-zim
          path: output/*.zim
          retention-days: 7
