name: Build ZIM Artifact

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      language:
        description: 'Language code to scrape (e.g. en, de, fr, es)'
        required: true
        default: 'en'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4[span_2](start_span)[span_2](end_span)[span_3](start_span)[span_3](end_span)

      - name: Set up Python 3.10
        uses: actions/setup-python@v5[span_4](start_span)[span_4](end_span)[span_5](start_span)[span_5](end_span)
        with:
          python-version: "3.10[span_6](start_span)[span_7](start_span)"[span_6](end_span)[span_7](end_span)
          cache: "pip[span_8](start_span)[span_9](start_span)"[span_8](end_span)[span_9](end_span)

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8[span_10](start_span)[span_10](end_span)[span_11](start_span)[span_11](end_span)

      - name: Check Formatting & Lint
        run: |
          black --check --line-length 88 .[span_12](start_span)[span_12](end_span)[span_13](start_span)[span_13](end_span)
          isort --check-only --profile black .[span_14](start_span)[span_14](end_span)[span_15](start_span)[span_15](end_span)
          flake8 . --max-line-length=88[span_16](start_span)[span_16](end_span)[span_17](start_span)[span_17](end_span)

  build-zim:
    name: Build ZIM File & Upload Artifact
    runs-on: ubuntu-latest[span_18](start_span)[span_18](end_span)[span_19](start_span)[span_19](end_span)
    needs: lint[span_20](start_span)[span_20](end_span)[span_21](start_span)[span_21](end_span)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4[span_22](start_span)[span_22](end_span)[span_23](start_span)[span_23](end_span)

      - name: Set up Python 3.10
        uses: actions/setup-python@v5[span_24](start_span)[span_24](end_span)[span_25](start_span)[span_25](end_span)
        with:
          python-version: "3.10[span_26](start_span)[span_27](start_span)"[span_26](end_span)[span_27](end_span)
          cache: "pip[span_28](start_span)[span_29](start_span)"[span_28](end_span)[span_29](end_span)

      - name: Install Dependencies & wikihow2zim
        run: |
          python -m pip install --upgrade pip[span_30](start_span)[span_30](end_span)[span_31](start_span)[span_31](end_span)
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi[span_32](start_span)[span_32](end_span)[span_33](start_span)[span_33](end_span)
          pip install --no-build-isolation .[span_34](start_span)[span_34](end_span)

      - name: Create Output Directory
        run: mkdir -p output[span_35](start_span)[span_35](end_span)[span_36](start_span)[span_36](end_span)

      - name: Run wikihow2zim Scraper
        run: |
          LANG_CODE="${{ github.event.inputs.language || 'en' }}"
          wikihow2zim --language "$LANG_CODE" --output output/

      - name: Upload ZIM Artifact
        uses: actions/upload-artifact@v4[span_37](start_span)[span_37](end_span)[span_38](start_span)[span_38](end_span)
        with:
          name: wikihow-${{ github.event.inputs.language || 'en' }}-zim
          path: output/*.zim[span_39](start_span)[span_39](end_span)[span_40](start_span)[span_40](end_span)
          retention-days: 7[span_41](start_span)[span_41](end_span)[span_42](start_span)[span_42](end_span)
