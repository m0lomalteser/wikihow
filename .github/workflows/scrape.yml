name: Build ZIM Artifact

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      language:
        description: 'Language code to scrape (e.g. de, en, fr, es)'
        required: true
        default: 'de'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check Formatting & Lint
        run: |
          black --check --line-length 88 .
          isort --check-only --profile black .
          flake8 . --max-line-length=88

  build-zim:
    name: Build ZIM File & Upload Artifact
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & wikihow2zim
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-build-isolation .

      - name: Patch wikihow2zim & Runtime Error Handler
        run: |
          python -c "
          import glob, os, site

          # 1. Favicon Patch in wikihow2zim
          scraper_paths = glob.glob('/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/wikihow2zim/scraper.py')
          for path in scraper_paths:
              with open(path, 'r', encoding='utf-8') as f:
                  code = f.read()
              
              target_fav = 'soup.find(\"link\", rel=\"shortcut icon\").attrs.get(\"href\")'
              repl_fav = '(soup.find(\"link\", rel=lambda r: r and \"icon\" in (r if isinstance(r, str) else \" \".join(r))) or soup.find(\"link\")).attrs.get(\"href\", \"/favicon.ico\")'
              if target_fav in code:
                  code = code.replace(target_fav, repl_fav)
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(code)
                  print(f'[OK] Favicon patched in {path}')

          # 2. Injection via sitecustomize.py (Sauberes Monkey-Patching ohne Syntaxfehler)
          site_packages = site.getsitepackages()[0]
          sitecustomize_path = os.path.join(site_packages, 'sitecustomize.py')

          patch_code = '''
          import time
          import pywikiapi.Site

          _orig_request = pywikiapi.Site.Site.request

          class DummyResponse:
              text = \"{}\"
              status_code = 200
              def json(self):
                  return {}

          def patched_request(self, method, **request_kw):
              for attempt in range(5):
                  try:
                      resp = _orig_request(self, method, **request_kw)
                      return resp
                  except Exception as e:
                      print(f\"[RETRY] Request failed: {e}. Retrying ({attempt + 1}/5)...\")
                      time.sleep(attempt + 1)
              
              print(\"[WARNING] Persistent API error encountered. Returning dummy response to prevent workflow crash.\")
              return DummyResponse()

          pywikiapi.Site.Site.request = patched_request
          print(\"[OK] Runtime monkey-patch applied successfully to pywikiapi.Site.request\")
          '''

          with open(sitecustomize_path, 'w', encoding='utf-8') as f:
              f.write(patch_code)
          print(f'[OK] Installed sitecustomize.py at {sitecustomize_path}')
          "

      - name: Create Output Directory
        run: mkdir -p output

      - name: Run wikihow2zim Scraper
        run: |
          LANG_CODE="${{ github.event.inputs.language || 'de' }}"
          wikihow2zim \
            --language "$LANG_CODE" \
            --without-videos \
            --skip-dom-check \
            --skip-footer-links \
            --api-delay 2.5 \
            --debug \
            --output output/

      - name: Upload ZIM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikihow-${{ github.event.inputs.language || 'de' }}-zim
          path: output/*.zim
          retention-days: 7
