name: Build ZIM Artifact

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      language:
        description: 'Language code to scrape (e.g. de, en, fr, es)'
        required: true
        default: 'de'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check Formatting & Lint
        run: |
          black --check --line-length 88 .
          isort --check-only --profile black .
          flake8 . --max-line-length=88

  build-zim:
    name: Build ZIM File & Upload Artifact
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & wikihow2zim
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-build-isolation .

      - name: Apply AST/Source Patches (Favicon & Category Query Batch Limit)
        run: |
          python -c "
          import os, glob

          # 1. Favicon Patch
          targets_scraper = glob.glob('/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/wikihow2zim/scraper.py') + glob.glob('wikihow2zim/scraper.py')
          for path in targets_scraper:
              if os.path.exists(path):
                  with open(path, 'r', encoding='utf-8') as f:
                      code = f.read()
                  
                  # Favicon fix
                  target_fav = 'soup.find(\"link\", rel=\"shortcut icon\").attrs.get(\"href\")'
                  repl_fav = '(soup.find(\"link\", rel=lambda r: r and \"icon\" in (r if isinstance(r, str) else \" \".join(r))) or soup.find(\"link\")).attrs.get(\"href\", \"/favicon.ico\")'
                  if target_fav in code:
                      code = code.replace(target_fav, repl_fav)

                  # 2. Category Batch Limit Fix (Verhindert HTTP 500 Timeouts auf wikiHow-Servern)
                  # Fügt cmlimit=50/cmlimit=100 hinzu oder überschreibt bestehende cmlimit Parameter in build_expected_categories
                  if 'def build_expected_categories' in code:
                      code = code.replace('list=\"categorymembers\",', 'list=\"categorymembers\", cmlimit=\"50\",')
                      print(f'[OK] Patched build_expected_categories batch limit in {path}')

                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(code)
                  print(f'[OK] Updated {path}')
          "

      - name: Setup sitecustomize.py (Catch ApiError & Retry Engine)
        run: |
          python -c "
          import site, os

          site_packages = site.getsitepackages()[0]
          sitecustomize_path = os.path.join(site_packages, 'sitecustomize.py')

          patch_code = '''
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util import Retry
          import pywikiapi.Site

          # Network Retry Setup
          retry_strategy = Retry(
              total=5,
              backoff_factor=1.5,
              status_forcelist=[500, 502, 503, 504],
              raise_on_status=False
          )

          old_init = requests.Session.__init__
          def new_init(self, *args, **kwargs):
              old_init(self, *args, **kwargs)
              adapter = HTTPAdapter(max_retries=retry_strategy)
              self.mount(\"http://\", adapter)
              self.mount(\"https://\", adapter)

          requests.Session.__init__ = new_init

          # PyWikiAPI Error Handling Patch
          _orig_iterate = pywikiapi.Site.Site.iterate
          def safe_iterate(self, action, **req):
              try:
                  yield from _orig_iterate(self, action, **req)
              except pywikiapi.utils.ApiError as e:
                  print(f\"[WARNING] Ignored ApiError during query iteration: {e}\")

          pywikiapi.Site.Site.iterate = safe_iterate
          print(\"[OK] Successfully patched PyWikiAPI iterate error boundary\")
          '''

          with open(sitecustomize_path, 'w', encoding='utf-8') as f:
              f.write(patch_code)
          print(f'[OK] Injected runtime safety net to {sitecustomize_path}')
          "

      - name: Create Output Directory
        run: mkdir -p output

      - name: Run wikihow2zim Scraper
        run: |
          LANG_CODE="${{ github.event.inputs.language || 'de' }}"
          wikihow2zim \
            --language "$LANG_CODE" \
            --without-videos \
            --skip-dom-check \
            --skip-footer-links \
            --api-delay 2.5 \
            --debug \
            --output output/

      - name: Upload ZIM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikihow-${{ github.event.inputs.language || 'de' }}-zim
          path: output/*.zim
          retention-days: 7
