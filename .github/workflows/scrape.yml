name: Build ZIM Artifact

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      language:
        description: 'Language code to scrape (e.g. de, en, fr, es)'
        required: true
        default: 'de'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check Formatting & Lint
        run: |
          black --check --line-length 88 .
          isort --check-only --profile black .
          flake8 . --max-line-length=88

  build-zim:
    name: Build ZIM File & Upload Artifact
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & wikihow2zim
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-build-isolation .

      - name: Patch wikihow2zim & Inject Network Hardening
        run: |
          python -c "
          import glob, os, site

          # 1. Scraper Code Patches
          scraper_paths = glob.glob('/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/wikihow2zim/scraper.py')
          for path in scraper_paths:
              with open(path, 'r', encoding='utf-8') as f:
                  code = f.read()
              
              # Favicon Fallback Fix
              target_fav = 'soup.find(\"link\", rel=\"shortcut icon\").attrs.get(\"href\")'
              repl_fav = '(soup.find(\"link\", rel=lambda r: r and \"icon\" in (r if isinstance(r, str) else \" \".join(r))) or soup.find(\"link\")).attrs.get(\"href\", \"/favicon.ico\")'
              if target_fav in code:
                  code = code.replace(target_fav, repl_fav)

              # Patch categorymembers params to avoid database timeouts
              if 'list=\"categorymembers\",' in code:
                  code = code.replace('list=\"categorymembers\",', 'list=\"categorymembers\", cmlimit=\"20\", cmprop=\"ids|title\",')

              with open(path, 'w', encoding='utf-8') as f:
                  f.write(code)
              print(f'[OK] Patched scraper settings in {path}')

          # 2. Global HTTP Request Interceptor via sitecustomize.py
          site_packages = site.getsitepackages()[0]
          sitecustomize_path = os.path.join(site_packages, 'sitecustomize.py')

          patch_code = '''
          import time
          import requests

          _orig_session_request = requests.Session.request

          def custom_request(self, method, url, **kwargs):
              headers = kwargs.get(\"headers\") or {}
              
              # Inject browser headers to bypass WAF & bot filters
              browser_headers = {
                  \"User-Agent\": \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36\",
                  \"Accept\": \"text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8\",
                  \"Accept-Language\": \"en-US,en;q=0.9,de;q=0.8\",
                  \"Cache-Control\": \"max-age=0\",
                  \"Sec-Ch-Ua\": '\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\"',
                  \"Sec-Ch-Ua-Mobile\": \"?0\",
                  \"Sec-Ch-Ua-Platform\": '\"Windows\"',
                  \"Sec-Fetch-Dest\": \"document\",
                  \"Sec-Fetch-Mode\": \"navigate\",
                  \"Sec-Fetch-Site\": \"none\",
                  \"Sec-Fetch-User\": \"?1\",
                  \"Upgrade-Insecure-Requests\": \"1\"
              }
              
              for k, v in browser_headers.items():
                  if not any(existing.lower() == k.lower() for existing in headers):
                      headers[k] = v

              kwargs[\"headers\"] = headers

              # Retry exponential backoff for 50x / 429 WAF responses
              for attempt in range(6):
                  try:
                      resp = _orig_session_request(self, method, url, **kwargs)
                      if resp.status_code not in (500, 502, 503, 504, 429):
                          return resp
                      print(f\"[RETRY {attempt + 1}/6] HTTP {resp.status_code} for {url[:80]}. Waiting...\")
                  except Exception as e:
                      print(f\"[RETRY {attempt + 1}/6] Request error ({e}) for {url[:80]}. Waiting...\")
                  time.sleep(3 * (attempt + 1))

              return _orig_session_request(self, method, url, **kwargs)

          requests.Session.request = custom_request
          print(\"[OK] Global requests.Session monkey-patch active.\")
          '''

          with open(sitecustomize_path, 'w', encoding='utf-8') as f:
              f.write(patch_code)
          print(f'[OK] Installed sitecustomize.py at {sitecustomize_path}')
          "

      - name: Create Output Directory
        run: mkdir -p output

      - name: Run wikihow2zim Scraper
        run: |
          LANG_CODE="${{ github.event.inputs.language || 'de' }}"
          wikihow2zim \
            --language "$LANG_CODE" \
            --without-videos \
            --skip-dom-check \
            --skip-footer-links \
            --delay 1.0 \
            --api-delay 4.0 \
            --debug \
            --output output/

      - name: Upload ZIM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikihow-${{ github.event.inputs.language || 'de' }}-zim
          path: output/*.zim
          retention-days: 7
