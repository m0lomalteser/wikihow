name: Build ZIM Artifact

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      language:
        description: 'Language code to scrape (e.g. de, en, fr, es)'
        required: true
        default: 'de'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check Formatting & Lint
        run: |
          black --check --line-length 88 .
          isort --check-only --profile black .
          flake8 . --max-line-length=88

  build-zim:
    name: Build ZIM File & Upload Artifact
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & wikihow2zim
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-build-isolation .

      - name: Inject Global Network Retry & Favicon Patch
        run: |
          python -c "
          import site, os, glob

          # 1. Favicon Patch
          targets_scraper = glob.glob('/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/wikihow2zim/scraper.py') + glob.glob('wikihow2zim/scraper.py')
          for path in targets_scraper:
              if os.path.exists(path):
                  with open(path, 'r', encoding='utf-8') as f:
                      code = f.read()
                  target = 'soup.find(\"link\", rel=\"shortcut icon\").attrs.get(\"href\")'
                  replacement = '(soup.find(\"link\", rel=lambda r: r and \"icon\" in (r if isinstance(r, str) else \" \".join(r))) or soup.find(\"link\")).attrs.get(\"href\", \"/favicon.ico\")'
                  if target in code:
                      code = code.replace(target, replacement)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(code)
                      print(f'[OK] Patched Favicon in {path}')

          # 2. Network-Level Retry Patch via sitecustomize (Zwingt requests.Session zu Retries bei HTTP 500)
          site_packages = site.getsitepackages()[0]
          sitecustomize_path = os.path.join(site_packages, 'sitecustomize.py')

          patch_code = '''
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util import Retry

          # Configuriere aggressiven Retry-Mechanismus für Serverfehler (500, 502, 503, 504)
          retry_strategy = Retry(
              total=10,
              backoff_factor=2,  # Wartet 2s, 4s, 8s, 16s, 32s...
              status_forcelist=[500, 502, 503, 504],
              raise_on_status=False
          )

          old_init = requests.Session.__init__

          def new_init(self, *args, **kwargs):
              old_init(self, *args, **kwargs)
              adapter = HTTPAdapter(max_retries=retry_strategy)
              self.mount(\"http://\", adapter)
              self.mount(\"https://\", adapter)

          requests.Session.__init__ = new_init
          print(\"[OK] Successfully hooked requests.Session with HTTP 500 Retry Strategy\")
          '''

          with open(sitecustomize_path, 'w', encoding='utf-8') as f:
              f.write(patch_code)
          print(f'[OK] Injected urllib3/requests retry hook to {sitecustomize_path}')
          "

      - name: Create Output Directory
        run: mkdir -p output

      - name: Run wikihow2zim Scraper
        run: |
          LANG_CODE="${{ github.event.inputs.language || 'de' }}"
          wikihow2zim \
            --language "$LANG_CODE" \
            --without-videos \
            --skip-dom-check \
            --skip-footer-links \
            --api-delay 3.0 \
            --debug \
            --output output/

      - name: Upload ZIM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikihow-${{ github.event.inputs.language || 'de' }}-zim
          path: output/*.zim
          retention-days: 7
