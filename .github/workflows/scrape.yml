name: Build ZIM Artifact

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      language:
        description: 'Language code to scrape (e.g. de, en, fr, es)'
        required: true
        default: 'de'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check Formatting & Lint
        run: |
          black --check --line-length 88 .
          isort --check-only --profile black .
          flake8 . --max-line-length=88

  build-zim:
    name: Build ZIM File & Upload Artifact
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & wikihow2zim
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-build-isolation .

      - name: Patch wikihow2zim & pywikiapi
        run: |
          cat << 'EOF' > patch_dependencies.py
          import glob
          import os

          # 1. Favicon Patch in wikihow2zim
          targets_scraper = glob.glob('/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/wikihow2zim/scraper.py') + glob.glob('wikihow2zim/scraper.py')
          for path in targets_scraper:
              if os.path.exists(path):
                  with open(path, 'r', encoding='utf-8') as f:
                      code = f.read()
                  target = 'soup.find("link", rel="shortcut icon").attrs.get("href")'
                  replacement = '(soup.find("link", rel=lambda r: r and "icon" in (r if isinstance(r, str) else " ".join(r))) or soup.find("link")).attrs.get("href", "/favicon.ico")'
                  if target in code:
                      code = code.replace(target, replacement)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(code)
                      print(f'Successfully patched wikihow2zim at {path}')

          # 2. Universal API Retry Patch in pywikiapi
          targets_pywiki = glob.glob('/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/pywikiapi/Site.py')
          for path in targets_pywiki:
              if os.path.exists(path):
                  with open(path, 'r', encoding='utf-8') as f:
                      code = f.read()
                  
                  if 'def request(self,' in code and '_retry_patched' not in code:
                      old_def = 'def request(self, method, **request_kw):'
                      new_def = (
                          'def _original_request(self, method, **request_kw):\n'
                          '        pass\n\n'
                          '    _retry_patched = True\n'
                          '    def request(self, method, **request_kw):\n'
                          '        import time\n'
                          '        for attempt in range(6):\n'
                          '            try:\n'
                          '                return self._original_request(method, **request_kw)\n'
                          '            except Exception as e:\n'
                          '                if attempt == 5:\n'
                          '                    raise e\n'
                          '                print(f"[RETRY] API call failed (attempt {attempt + 1}/6). Retrying in {(attempt + 1) * 3}s... Error: {e}")\n'
                          '                time.sleep(3 * (attempt + 1))\n'
                      )
                      code = code.replace(old_def, new_def)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(code)
                      print(f'Successfully wrapped pywikiapi.request at {path}')
          EOF
          python patch_dependencies.py

      - name: Create Output Directory
        run: mkdir -p output

      - name: Run wikihow2zim Scraper
        run: |
          LANG_CODE="${{ github.event.inputs.language || 'de' }}"
          wikihow2zim \
            --language "$LANG_CODE" \
            --without-videos \
            --skip-dom-check \
            --skip-footer-links \
            --api-delay 1.5 \
            --debug \
            --output output/

      - name: Upload ZIM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikihow-${{ github.event.inputs.language || 'de' }}-zim
          path: output/*.zim
          retention-days: 7
