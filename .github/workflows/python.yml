name: Build wikiHow DE ZIM

on:
  workflow_dispatch: # Manuelles Starten über die GitHub-Oberfläche
  schedule:
    - cron: '0 2 1 * *' # Automatischer Lauf am 1. jeden Monats um 02:00 Uhr

jobs:
  build-zim:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies & wikihow2zim
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # --no-build-isolation verhindert das "No module named pip" Problem in der setup.py
          pip install --no-build-isolation .

      - name: Apply Request Patch (Fix HTTP 500 & User-Agent)
        run: |
          python -c "
          import site, os

          patch_code = '''
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          # Patch Global Session for requests
          old_session = requests.Session
          def patched_session(*args, **kwargs):
              sess = old_session(*args, **kwargs)
              sess.headers.update({'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'})
              retries = Retry(total=10, backoff_factor=3, status_forcelist=[500, 502, 503, 504], raise_on_status=False)
              sess.mount('https://', HTTPAdapter(max_retries=retries))
              return sess

          requests.Session = patched_session
          '''
          print('Patch setup script successfully prepared.')
          "

      - name: Run Scraper & Build ZIM
        run: |
          mkdir -p output
          
          # Starte den Scraper mit reduzierter Concurrency
          wikihow2zim \
            --language de \
            --output ./output \
            --name wikihow_de_all \
            --concurrency 2 \
            --verbose

      - name: Validate ZIM file size
        run: |
          ZIM_FILE=$(find ./output -name "*.zim" | head -n 1)
          if [ -z "$ZIM_FILE" ]; then
            echo "Fehler: Keine ZIM-Datei gefunden!"
            exit 1
          fi
          
          SIZE_MB=$(du -m "$ZIM_FILE" | cut -f1)
          echo "Erstellte ZIM-Datei: $ZIM_FILE ($SIZE_MB MB)"
          
          # Bricht ab, wenn das ZIM-Archiv unter 100 MB groß ist (verhindert leere Dumps)
          if [ "$SIZE_MB" -lt 100 ]; then
            echo "Fehler: ZIM-Datei ist nur $SIZE_MB MB groß (vermutlich wieder API-Timeout/0 Artikel)."
            exit 1
          fi

      - name: Upload ZIM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikihow-de-zim
          path: output/*.zim
          retention-days: 7
